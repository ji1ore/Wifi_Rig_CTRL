plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.ji1ore.wifi_rig_ctrl'
    compileSdk 35

    defaultConfig {
        applicationId "com.ji1ore.wifi_rig_ctrl"
        minSdk 26
        targetSdk 35
        versionCode 200
        versionName "2.00"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    signingConfigs {
        release {
            // Load signing credentials from local.properties (not committed to VCS)
            // Create local.properties with:
            //   KEYSTORE_FILE=../wifi_rig_ctrl.jks
            //   KEYSTORE_PASSWORD=your_password
            //   KEY_ALIAS=wifi-rig-ctrl
            //   KEY_PASSWORD=your_password
            def props = new Properties()
            def localPropsFile = rootProject.file('local.properties')
            if (localPropsFile.exists()) props.load(localPropsFile.newDataInputStream())
            storeFile     props.getProperty('KEYSTORE_FILE')     ? file(props.getProperty('KEYSTORE_FILE'))     : null
            storePassword props.getProperty('KEYSTORE_PASSWORD') ?: ''
            keyAlias      props.getProperty('KEY_ALIAS')         ?: ''
            keyPassword   props.getProperty('KEY_PASSWORD')      ?: ''
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.7'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.7'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1'

    // ViewModel & LiveData
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.3'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.3'

    // USB Serial (CH340/CDC ACM)
    implementation 'com.github.mik3y:usb-serial-for-android:3.8.0'

    // OkHttp
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Gson
    implementation 'com.google.code.gson:gson:2.11.0'

    // (ExoPlayerは未使用のため削除)

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
