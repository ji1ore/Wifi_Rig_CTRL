; PlatformIO Project Configuration File
;
; M5CoreHamCAT for M5Stack Stopwatch開発キット (ESP32-S3R8, 466x466 円形AMOLED, CO5300 panel)
; M5StopWatchには専用のPlatformIOボードIDが無いため、汎用の esp32-s3-devkitc-1 に
; OPI PSRAM(8MB) + 16MBフラッシュを載せてビルドする(M5Unifiedのランタイム自動判定
; M5.begin() -> M5.getBoard() == board_t::board_M5StopWatch に依存する構成。
; SP2ALART_M5STOP_1.00 の platformio.ini と同一構成)。
;
; https://docs.platformio.org/page/projectconf.html

[env:m5stopwatch]
platform = platformio/espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.psram = enabled
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -DBOARD_HAS_PSRAM
    -DCONFIG_PM_ENABLE=1

; NOTE: ES8388(Module Audio)/Unit_Encoder/NeoPixelはM5StopWatchに物理ポートが無いため
; 非搭載。無線機音声はM5.Mic/M5.Speakerの内蔵デバイスのみで扱う。
lib_deps =
    https://github.com/m5stack/M5GFX.git
    https://github.com/m5stack/M5Unified.git
    bblanchon/ArduinoJson @ ^7.0.0
extra_scripts = post:merge_bin.py
