[package]
name        = "mfsk-decode"
version     = "0.13.1"
edition     = "2021"
publish     = false

[[bin]]
name = "mfsk-decode"
path = "src/main.rs"

[dependencies]
mfsk-core = { git = "https://github.com/jl1nie/mfsk-core", tag = "v0.13.1", package = "mfsk-core", features = ["fft-rustfft", "ft8", "ft4"] }
hound = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
